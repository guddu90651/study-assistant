services:
  # ----------------------------------------------------
  # 1. Backend Web Service (Node.js / Express)
  # ----------------------------------------------------
  - type: web
    name: study-assistant-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://study-assistant-mk34.onrender.com
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard

  # ----------------------------------------------------
  # 2. Frontend Static Site (React / Vite)
  # ----------------------------------------------------
  - type: static
    name: study-assistant
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://study-assistant-backend-rzak.onrender.com
